<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" font-family="Times New Roman, serif">
  <rect width="1600" height="1500" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f3864">
    EstateAI Rwanda — Database Tables Structure
  </text>
  <text x="800" y="68" text-anchor="middle" font-size="14" font-style="italic" fill="#666">
    PostgreSQL relational database — 14 tables organized by purpose
  </text>

  <!-- Legend -->
  <g>
    <rect x="40" y="90" width="340" height="42" fill="#fafafa" stroke="#888" stroke-width="1" rx="4"/>
    <text x="50" y="108" font-size="11" font-weight="bold">Legend:</text>
    <text x="50" y="125" font-size="11"><tspan font-weight="bold" fill="#c53030">PK</tspan> = Primary Key,  <tspan font-weight="bold" fill="#2563eb">FK</tspan> = Foreign Key,  <tspan font-style="italic" fill="#666">italic = nullable</tspan></text>
  </g>

  <!-- ======= GROUP 1: CORE TABLES ======= -->
  <text x="40" y="172" font-size="14" font-weight="bold" font-style="italic" fill="#1f3864">CORE TABLES</text>

  <!-- USERS TABLE -->
  <g>
    <rect x="40" y="185" width="280" height="320" fill="#fff" stroke="#1f3864" stroke-width="2" rx="6"/>
    <rect x="40" y="185" width="280" height="30" fill="#1f3864" rx="6"/>
    <rect x="40" y="205" width="280" height="10" fill="#1f3864"/>
    <text x="180" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">users</text>
    <g font-size="11" fill="#222">
      <text x="50" y="234"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="50" y="252">email : VARCHAR(120) UNIQUE</text>
      <text x="50" y="270">password_hash : VARCHAR(200)</text>
      <text x="50" y="288">name : VARCHAR(120)</text>
      <text x="50" y="306">phone : VARCHAR(40)</text>
      <text x="50" y="324" font-style="italic">avatar_url : VARCHAR(500)</text>
      <text x="50" y="342">is_admin : BOOLEAN</text>
      <text x="50" y="360">role : VARCHAR(20)</text>
      <text x="50" y="378">suspended : BOOLEAN</text>
      <text x="50" y="396">email_verified : BOOLEAN</text>
      <text x="50" y="414" font-style="italic">google_sub : VARCHAR(200)</text>
      <text x="50" y="432">agent_status : VARCHAR(20)</text>
      <text x="50" y="450" font-style="italic">premium_until : TIMESTAMP</text>
      <text x="50" y="468" font-style="italic">expo_push_token : VARCHAR(200)</text>
      <text x="50" y="486">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- PROPERTIES TABLE -->
  <g>
    <rect x="340" y="185" width="290" height="510" fill="#fff" stroke="#1f3864" stroke-width="2" rx="6"/>
    <rect x="340" y="185" width="290" height="30" fill="#1f3864" rx="6"/>
    <rect x="340" y="205" width="290" height="10" fill="#1f3864"/>
    <text x="485" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">properties</text>
    <g font-size="11" fill="#222">
      <text x="350" y="234"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="350" y="252"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  user_id → users.id</text>
      <text x="350" y="270">title : VARCHAR(200)</text>
      <text x="350" y="288">price : FLOAT</text>
      <text x="350" y="306">currency : VARCHAR(10)</text>
      <text x="350" y="324">type : VARCHAR(20)  (buy/rent)</text>
      <text x="350" y="342">property_type : VARCHAR(40)</text>
      <text x="350" y="360">district : VARCHAR(80)</text>
      <text x="350" y="378">sector : VARCHAR(80)</text>
      <text x="350" y="396" font-style="italic">latitude : FLOAT</text>
      <text x="350" y="414" font-style="italic">longitude : FLOAT</text>
      <text x="350" y="432" font-style="italic">bedrooms : INTEGER</text>
      <text x="350" y="450" font-style="italic">bathrooms : INTEGER</text>
      <text x="350" y="468" font-style="italic">size_sqft : INTEGER</text>
      <text x="350" y="486" font-style="italic">image_url : VARCHAR(500)</text>
      <text x="350" y="504">status : VARCHAR(20)</text>
      <text x="350" y="522">availability : VARCHAR(20)</text>
      <text x="350" y="540">featured : BOOLEAN</text>
      <text x="350" y="558" font-style="italic">payment_methods : VARCHAR(120)</text>
      <text x="350" y="576" font-style="italic">mtn_number : VARCHAR(32)</text>
      <text x="350" y="594" font-style="italic">airtel_number : VARCHAR(32)</text>
      <text x="350" y="612" font-style="italic">bk_account_number : VARCHAR(40)</text>
      <text x="350" y="630" font-style="italic">equity_account_number : VARCHAR(40)</text>
      <text x="350" y="648">show_payment_details : BOOLEAN</text>
      <text x="350" y="666">payment_flagged : BOOLEAN</text>
      <text x="350" y="684">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- ======= GROUP 2: COMMUNICATION ======= -->
  <text x="660" y="172" font-size="14" font-weight="bold" font-style="italic" fill="#2f855a">COMMUNICATION</text>

  <!-- CONVERSATIONS TABLE -->
  <g>
    <rect x="660" y="185" width="280" height="155" fill="#fff" stroke="#2f855a" stroke-width="2" rx="6"/>
    <rect x="660" y="185" width="280" height="30" fill="#2f855a" rx="6"/>
    <rect x="660" y="205" width="280" height="10" fill="#2f855a"/>
    <text x="800" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">conversations</text>
    <g font-size="11" fill="#222">
      <text x="670" y="234"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="670" y="252"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  property_id → properties.id</text>
      <text x="670" y="270"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  buyer_id → users.id</text>
      <text x="670" y="288"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  seller_id → users.id</text>
      <text x="670" y="306">last_message_at : TIMESTAMP</text>
      <text x="670" y="324">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- MESSAGES TABLE -->
  <g>
    <rect x="960" y="185" width="280" height="155" fill="#fff" stroke="#2f855a" stroke-width="2" rx="6"/>
    <rect x="960" y="185" width="280" height="30" fill="#2f855a" rx="6"/>
    <rect x="960" y="205" width="280" height="10" fill="#2f855a"/>
    <text x="1100" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">messages</text>
    <g font-size="11" fill="#222">
      <text x="970" y="234"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="970" y="252"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  conversation_id → conversations.id</text>
      <text x="970" y="270"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  sender_id → users.id</text>
      <text x="970" y="288">content : TEXT</text>
      <text x="970" y="306">read_at : TIMESTAMP</text>
      <text x="970" y="324">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- AI_CONVERSATIONS TABLE -->
  <g>
    <rect x="1260" y="185" width="280" height="135" fill="#fff" stroke="#2f855a" stroke-width="2" rx="6"/>
    <rect x="1260" y="185" width="280" height="30" fill="#2f855a" rx="6"/>
    <rect x="1260" y="205" width="280" height="10" fill="#2f855a"/>
    <text x="1400" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">ai_conversations</text>
    <g font-size="11" fill="#222">
      <text x="1270" y="234"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="1270" y="252"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  user_id → users.id</text>
      <text x="1270" y="270">title : VARCHAR(200)</text>
      <text x="1270" y="288">summary : TEXT</text>
      <text x="1270" y="306">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- AI_MESSAGES TABLE -->
  <g>
    <rect x="660" y="360" width="280" height="135" fill="#fff" stroke="#2f855a" stroke-width="2" rx="6"/>
    <rect x="660" y="360" width="280" height="30" fill="#2f855a" rx="6"/>
    <rect x="660" y="380" width="280" height="10" fill="#2f855a"/>
    <text x="800" y="381" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">ai_messages</text>
    <g font-size="11" fill="#222">
      <text x="670" y="409"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="670" y="427"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  conversation_id → ai_conversations.id</text>
      <text x="670" y="445">role : VARCHAR(20) (user/assistant)</text>
      <text x="670" y="463">content : TEXT</text>
      <text x="670" y="481">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- RENTAL_INQUIRIES TABLE -->
  <g>
    <rect x="960" y="360" width="280" height="170" fill="#fff" stroke="#2f855a" stroke-width="2" rx="6"/>
    <rect x="960" y="360" width="280" height="30" fill="#2f855a" rx="6"/>
    <rect x="960" y="380" width="280" height="10" fill="#2f855a"/>
    <text x="1100" y="381" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">rental_inquiries</text>
    <g font-size="11" fill="#222">
      <text x="970" y="409"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="970" y="427"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  property_id → properties.id</text>
      <text x="970" y="445"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  renter_id → users.id</text>
      <text x="970" y="463"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  owner_id → users.id</text>
      <text x="970" y="481">kind : VARCHAR(20)</text>
      <text x="970" y="499">status : VARCHAR(20)</text>
      <text x="970" y="517">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- ======= GROUP 3: ANALYTICS ======= -->
  <text x="1260" y="357" font-size="14" font-weight="bold" font-style="italic" fill="#a16207">ANALYTICS</text>

  <!-- PROPERTY_VIEWS TABLE -->
  <g>
    <rect x="1260" y="370" width="280" height="135" fill="#fff" stroke="#a16207" stroke-width="2" rx="6"/>
    <rect x="1260" y="370" width="280" height="30" fill="#a16207" rx="6"/>
    <rect x="1260" y="390" width="280" height="10" fill="#a16207"/>
    <text x="1400" y="391" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">property_views</text>
    <g font-size="11" fill="#222">
      <text x="1270" y="419"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="1270" y="437"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  property_id → properties.id</text>
      <text x="1270" y="455" font-style="italic"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  user_id → users.id</text>
      <text x="1270" y="473">session_id : VARCHAR(80)</text>
      <text x="1270" y="491">viewed_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- ======= GROUP 4: SECURITY ======= -->
  <text x="40" y="540" font-size="14" font-weight="bold" font-style="italic" fill="#7c3aed">AUTHENTICATION &amp; SECURITY</text>

  <!-- REVOKED_TOKENS -->
  <g>
    <rect x="40" y="555" width="280" height="120" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="6"/>
    <rect x="40" y="555" width="280" height="30" fill="#7c3aed" rx="6"/>
    <rect x="40" y="575" width="280" height="10" fill="#7c3aed"/>
    <text x="180" y="576" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">revoked_tokens</text>
    <g font-size="11" fill="#222">
      <text x="50" y="604"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="50" y="622">jti : VARCHAR(100) UNIQUE</text>
      <text x="50" y="640">user_id : INTEGER</text>
      <text x="50" y="658">revoked_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- PASSWORD_RESET_CODES -->
  <g>
    <rect x="660" y="555" width="280" height="155" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="6"/>
    <rect x="660" y="555" width="280" height="30" fill="#7c3aed" rx="6"/>
    <rect x="660" y="575" width="280" height="10" fill="#7c3aed"/>
    <text x="800" y="576" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">password_reset_codes</text>
    <g font-size="11" fill="#222">
      <text x="670" y="604"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="670" y="622"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  user_id → users.id</text>
      <text x="670" y="640">code_hash : VARCHAR(200)</text>
      <text x="670" y="658">expires_at : TIMESTAMP</text>
      <text x="670" y="676">used : BOOLEAN</text>
      <text x="670" y="694">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- EMAIL_VERIFICATION_CODES -->
  <g>
    <rect x="960" y="555" width="280" height="155" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="6"/>
    <rect x="960" y="555" width="280" height="30" fill="#7c3aed" rx="6"/>
    <rect x="960" y="575" width="280" height="10" fill="#7c3aed"/>
    <text x="1100" y="576" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">email_verification_codes</text>
    <g font-size="11" fill="#222">
      <text x="970" y="604"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="970" y="622"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  user_id → users.id</text>
      <text x="970" y="640">code_hash : VARCHAR(200)</text>
      <text x="970" y="658">expires_at : TIMESTAMP</text>
      <text x="970" y="676">used : BOOLEAN</text>
      <text x="970" y="694">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- ======= GROUP 5: MONEY ======= -->
  <text x="40" y="720" font-size="14" font-weight="bold" font-style="italic" fill="#d97706">PAYMENTS</text>

  <!-- PAYMENTS TABLE -->
  <g>
    <rect x="40" y="735" width="290" height="265" fill="#fff" stroke="#d97706" stroke-width="2" rx="6"/>
    <rect x="40" y="735" width="290" height="30" fill="#d97706" rx="6"/>
    <rect x="40" y="755" width="290" height="10" fill="#d97706"/>
    <text x="185" y="756" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">payments</text>
    <g font-size="11" fill="#222">
      <text x="50" y="784"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="50" y="802"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  user_id → users.id</text>
      <text x="50" y="820">provider : VARCHAR(20) (mtn/airtel/stub)</text>
      <text x="50" y="838">transaction_id : VARCHAR(80) UNIQUE</text>
      <text x="50" y="856">amount : FLOAT</text>
      <text x="50" y="874">currency : VARCHAR(10)</text>
      <text x="50" y="892">phone : VARCHAR(40)</text>
      <text x="50" y="910">status : VARCHAR(20)</text>
      <text x="50" y="928">purpose : VARCHAR(40)</text>
      <text x="50" y="946">target_type : VARCHAR(40)</text>
      <text x="50" y="964">target_id : VARCHAR(40)</text>
      <text x="50" y="982">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- PROPERTY_CONTACT_UNLOCKS -->
  <g>
    <rect x="350" y="735" width="290" height="140" fill="#fff" stroke="#d97706" stroke-width="2" rx="6"/>
    <rect x="350" y="735" width="290" height="30" fill="#d97706" rx="6"/>
    <rect x="350" y="755" width="290" height="10" fill="#d97706"/>
    <text x="495" y="756" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">property_contact_unlocks</text>
    <g font-size="11" fill="#222">
      <text x="360" y="784"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="360" y="802"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  user_id → users.id</text>
      <text x="360" y="820"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  property_id → properties.id</text>
      <text x="360" y="838" font-style="italic"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  payment_id → payments.id</text>
      <text x="360" y="856">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- ======= GROUP 6: ADMIN ======= -->
  <text x="660" y="720" font-size="14" font-weight="bold" font-style="italic" fill="#c53030">ADMIN AUDIT</text>

  <!-- AUDIT_LOG -->
  <g>
    <rect x="660" y="735" width="290" height="200" fill="#fff" stroke="#c53030" stroke-width="2" rx="6"/>
    <rect x="660" y="735" width="290" height="30" fill="#c53030" rx="6"/>
    <rect x="660" y="755" width="290" height="10" fill="#c53030"/>
    <text x="805" y="756" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">audit_log</text>
    <g font-size="11" fill="#222">
      <text x="670" y="784"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="670" y="802">action : VARCHAR(60)</text>
      <text x="670" y="820"><tspan font-weight="bold" fill="#2563eb">FK</tspan>  actor_id → users.id</text>
      <text x="670" y="838">target_type : VARCHAR(40)</text>
      <text x="670" y="856">target_id : VARCHAR(40)</text>
      <text x="670" y="874">detail : TEXT</text>
      <text x="670" y="892">created_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- ======= GROUP 7: EXTERNAL ======= -->
  <text x="970" y="720" font-size="14" font-weight="bold" font-style="italic" fill="#0891b2">EXTERNAL INGESTION</text>

  <!-- LISTINGS -->
  <g>
    <rect x="970" y="735" width="290" height="200" fill="#fff" stroke="#0891b2" stroke-width="2" rx="6"/>
    <rect x="970" y="735" width="290" height="30" fill="#0891b2" rx="6"/>
    <rect x="970" y="755" width="290" height="10" fill="#0891b2"/>
    <text x="1115" y="756" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">listings</text>
    <g font-size="11" fill="#222">
      <text x="980" y="784"><tspan font-weight="bold" fill="#c53030">PK</tspan>  id : INTEGER</text>
      <text x="980" y="802">source : VARCHAR(60)</text>
      <text x="980" y="820">source_id : VARCHAR(120)</text>
      <text x="980" y="838">title : VARCHAR(200)</text>
      <text x="980" y="856">price : FLOAT</text>
      <text x="980" y="874">sector : VARCHAR(80)</text>
      <text x="980" y="892">scraped_at : TIMESTAMP</text>
    </g>
  </g>

  <!-- ======= SUMMARY BOX ======= -->
  <g>
    <rect x="40" y="1030" width="1500" height="160" fill="#f7fafc" stroke="#1f3864" stroke-width="1.5" rx="8"/>
    <text x="60" y="1058" font-size="15" font-weight="bold" fill="#1f3864">Summary of Tables</text>
    <g font-size="12" fill="#2d2d2d">
      <text x="60" y="1082"><tspan font-weight="bold">Core (2):</tspan>  users, properties</text>
      <text x="60" y="1102"><tspan font-weight="bold">Communication (5):</tspan>  conversations, messages, ai_conversations, ai_messages, rental_inquiries</text>
      <text x="60" y="1122"><tspan font-weight="bold">Security (3):</tspan>  revoked_tokens, password_reset_codes, email_verification_codes</text>
      <text x="60" y="1142"><tspan font-weight="bold">Payments (2):</tspan>  payments, property_contact_unlocks</text>
      <text x="60" y="1162"><tspan font-weight="bold">Analytics (1):</tspan>  property_views</text>
      <text x="60" y="1182"><tspan font-weight="bold">Admin / Ingestion (2):</tspan>  audit_log, listings</text>
      <text x="850" y="1082"><tspan font-weight="bold" fill="#1f3864">Total:</tspan>  15 tables</text>
      <text x="850" y="1102"><tspan font-weight="bold">Engine:</tspan>  PostgreSQL (production), SQLite (development)</text>
      <text x="850" y="1122"><tspan font-weight="bold">ORM:</tspan>  SQLAlchemy 2.0 via Flask-SQLAlchemy</text>
      <text x="850" y="1142"><tspan font-weight="bold">Migrations:</tspan>  Idempotent migrate.py (dialect-aware)</text>
      <text x="850" y="1162"><tspan font-weight="bold">Indexed columns:</tspan>  email, jti, transaction_id, status, featured</text>
      <text x="850" y="1182"><tspan font-weight="bold">Backup:</tspan>  Render automated daily snapshot</text>
    </g>
  </g>
</svg>
