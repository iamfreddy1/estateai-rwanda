    <line x1="160" y1="370" x2="340" y2="180"/>
    <line x1="160" y1="550" x2="340" y2="180"/>
    <line x1="160" y1="730" x2="340" y2="180"/>
    <line x1="160" y1="900" x2="340" y2="180"/>

    <!-- Buyer connections -->
    <line x1="160" y1="200" x2="610" y2="180"/>
    <line x1="160" y1="210" x2="610" y2="240"/>
    <line x1="160" y1="220" x2="610" y2="300"/>
    <line x1="160" y1="225" x2="867" y2="180"/>
    <line x1="160" y1="232" x2="867" y2="240"/>
    <line x1="160" y1="220" x2="340" y2="355"/>
    <line x1="160" y1="225" x2="340" y2="415"/>
    <line x1="160" y1="232" x2="340" y2="475"/>
    <line x1="160" y1="240" x2="867" y2="415"/>
    <line x1="160" y1="245" x2="867" y2="475"/>
    <line x1="160" y1="250" x2="610" y2="673"/>

    <!-- Renter connections -->
    <line x1="160" y1="380" x2="610" y2="180"/>
    <line x1="160" y1="385" x2="610" y2="240"/>
    <line x1="160" y1="390" x2="610" y2="300"/>
    <line x1="160" y1="395" x2="867" y2="180"/>
    <line x1="160" y1="400" x2="867" y2="240"/>
    <line x1="160" y1="405" x2="340" y2="355"/>
    <line x1="160" y1="410" x2="340" y2="415"/>
    <line x1="160" y1="415" x2="340" y2="475"/>
    <line x1="160" y1="420" x2="867" y2="415"/>
    <line x1="160" y1="425" x2="867" y2="475"/>
    <line x1="160" y1="430" x2="610" y2="673"/>

    <!-- Seller connections -->
    <line x1="160" y1="555" x2="610" y2="410"/>
    <line x1="160" y1="560" x2="610" y2="470"/>
    <line x1="160" y1="565" x2="610" y2="530"/>
    <line x1="160" y1="570" x2="610" y2="590"/>
    <line x1="160" y1="575" x2="867" y2="355"/>
    <line x1="160" y1="580" x2="867" y2="415"/>

    <!-- Landlord connections -->
    <line x1="160" y1="735" x2="610" y2="410"/>
    <line x1="160" y1="740" x2="610" y2="470"/>
    <line x1="160" y1="745" x2="610" y2="530"/>
    <line x1="160" y1="750" x2="867" y2="355"/>
    <line x1="160" y1="755" x2="338" y2="575"/>
    <line x1="160" y1="760" x2="338" y2="635"/>

    <!-- Agent connections -->
    <line x1="160" y1="910" x2="610" y2="733"/>
    <line x1="160" y1="912" x2="610" y2="410"/>
    <line x1="160" y1="914" x2="610" y2="470"/>

    <!-- Admin connections -->
    <line x1="1240" y1="535" x2="1067" y2="575" stroke="#c53030" stroke-width="1.3"/>
    <line x1="1240" y1="545" x2="1067" y2="635" stroke="#c53030" stroke-width="1.3"/>
    <line x1="1240" y1="555" x2="1067" y2="695" stroke="#c53030" stroke-width="1.3"/>
    <line x1="1240" y1="560" x2="1067" y2="755" stroke="#c53030" stroke-width="1.3"/>
    <line x1="1240" y1="565" x2="1067" y2="815" stroke="#c53030" stroke-width="1.3"/>
    <line x1="1240" y1="510" x2="1067" y2="180" stroke="#c53030" stroke-width="1.3"/>
  </g>

  <!-- LEGEND -->
  <g font-size="12" fill="#333">
    <rect x="320" y="870" width="760" height="80" fill="#ffffff" stroke="#888" stroke-width="1" rx="6"/>
    <text x="340" y="895" font-weight="bold" font-size="13">Legend:</text>
    <ellipse cx="370" cy="918" rx="16" ry="10" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="395" y="922">General use case</text>
    <ellipse cx="540" cy="918" rx="16" ry="10" fill="#fff4e6" stroke="#d97706" stroke-width="1.5"/>
    <text x="565" y="922">AI feature</text>
    <ellipse cx="660" cy="918" rx="16" ry="10" fill="#e6ffed" stroke="#2f855a" stroke-width="1.5"/>
    <text x="685" y="922">Contact / Landlord</text>
    <ellipse cx="830" cy="918" rx="16" ry="10" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
    <text x="855" y="922">Payment</text>
    <ellipse cx="950" cy="918" rx="16" ry="10" fill="#ffe5e5" stroke="#c53030" stroke-width="1.5"/>
    <text x="975" y="922">Admin only</text>
    <text x="340" y="942" font-style="italic" font-size="11" fill="#666">Lines between an actor and a use case show that the actor can perform that action.</text>
  </g>
</svg>
