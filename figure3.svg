<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Times New Roman, serif">
  <rect width="1400" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3864">
    Use Case Diagram of EstateAI Rwanda
  </text>

  <!-- System boundary rectangle -->
  <rect x="320" y="80" width="760" height="880" fill="#fafbfc" stroke="#1f3864" stroke-width="2.5" rx="10"/>
  <text x="700" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3864">
    EstateAI Rwanda System
  </text>

  <!-- ===== ACTORS (LEFT SIDE) ===== -->
  <!-- Buyer -->
  <g>
    <circle cx="130" cy="180" r="18" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="198" x2="130" y2="245" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="215" x2="160" y2="215" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="245" x2="105" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="245" x2="155" y2="280" stroke="#000" stroke-width="2"/>
    <text x="130" y="305" text-anchor="middle" font-size="14" font-weight="bold">Buyer</text>
  </g>

  <!-- Renter -->
  <g>
    <circle cx="130" cy="360" r="18" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="378" x2="130" y2="425" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="395" x2="160" y2="395" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="425" x2="105" y2="460" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="425" x2="155" y2="460" stroke="#000" stroke-width="2"/>
    <text x="130" y="485" text-anchor="middle" font-size="14" font-weight="bold">Renter</text>
  </g>

  <!-- Seller -->
  <g>
    <circle cx="130" cy="540" r="18" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="558" x2="130" y2="605" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="575" x2="160" y2="575" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="605" x2="105" y2="640" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="605" x2="155" y2="640" stroke="#000" stroke-width="2"/>
    <text x="130" y="665" text-anchor="middle" font-size="14" font-weight="bold">Seller</text>
  </g>

  <!-- Landlord -->
  <g>
    <circle cx="130" cy="720" r="18" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="738" x2="130" y2="785" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="755" x2="160" y2="755" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="785" x2="105" y2="820" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="785" x2="155" y2="820" stroke="#000" stroke-width="2"/>
    <text x="130" y="845" text-anchor="middle" font-size="14" font-weight="bold">Landlord</text>
  </g>

  <!-- Agent -->
  <g>
    <circle cx="130" cy="895" r="18" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="913" x2="130" y2="945" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="930" x2="160" y2="930" stroke="#000" stroke-width="2"/>
    <text x="130" y="975" text-anchor="middle" font-size="14" font-weight="bold">Agent</text>
  </g>

  <!-- ===== ACTOR (RIGHT SIDE) ===== -->
  <g>
    <circle cx="1270" cy="520" r="20" fill="#ffe0e0" stroke="#c53030" stroke-width="2.5"/>
    <line x1="1270" y1="540" x2="1270" y2="595" stroke="#c53030" stroke-width="2.5"/>
    <line x1="1235" y1="560" x2="1305" y2="560" stroke="#c53030" stroke-width="2.5"/>
    <line x1="1270" y1="595" x2="1240" y2="635" stroke="#c53030" stroke-width="2.5"/>
    <line x1="1270" y1="595" x2="1300" y2="635" stroke="#c53030" stroke-width="2.5"/>
    <text x="1270" y="660" text-anchor="middle" font-size="15" font-weight="bold" fill="#c53030">Administrator</text>
  </g>

  <!-- ===== USE CASES ===== -->
  <g font-size="13" fill="#2d2d2d">
    <!-- AUTHENTICATION GROUP -->
    <text x="430" y="148" font-size="13" font-weight="bold" font-style="italic" fill="#555">Authentication</text>
    <ellipse cx="430" cy="180" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="430" y="185" text-anchor="middle">Register / Login</text>
    <ellipse cx="430" cy="240" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="430" y="245" text-anchor="middle">Verify Email</text>

    <!-- BROWSING GROUP -->
    <text x="700" y="148" font-size="13" font-weight="bold" font-style="italic" fill="#555">Browsing &amp; Search</text>
    <ellipse cx="700" cy="180" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="700" y="185" text-anchor="middle">Browse Properties</text>
    <ellipse cx="700" cy="240" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="700" y="245" text-anchor="middle">Search &amp; Filter</text>
    <ellipse cx="700" cy="300" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="700" y="305" text-anchor="middle">View Details</text>

    <!-- AI GROUP -->
    <text x="965" y="148" font-size="13" font-weight="bold" font-style="italic" fill="#555">AI Features</text>
    <ellipse cx="965" cy="180" rx="100" ry="26" fill="#fff4e6" stroke="#d97706" stroke-width="1.5"/>
    <text x="965" y="185" text-anchor="middle">Get AI Price Prediction</text>
    <ellipse cx="965" cy="240" rx="100" ry="26" fill="#fff4e6" stroke="#d97706" stroke-width="1.5"/>
    <text x="965" y="245" text-anchor="middle">Chat with AI Assistant</text>

    <!-- CONTACT GROUP -->
    <text x="430" y="320" font-size="13" font-weight="bold" font-style="italic" fill="#555">Contact Seller</text>
    <ellipse cx="430" cy="355" rx="92" ry="26" fill="#e6ffed" stroke="#2f855a" stroke-width="1.5"/>
    <text x="430" y="360" text-anchor="middle">Call Seller</text>
    <ellipse cx="430" cy="415" rx="92" ry="26" fill="#e6ffed" stroke="#2f855a" stroke-width="1.5"/>
    <text x="430" y="420" text-anchor="middle">WhatsApp Seller</text>
    <ellipse cx="430" cy="475" rx="92" ry="26" fill="#e6ffed" stroke="#2f855a" stroke-width="1.5"/>
    <text x="430" y="480" text-anchor="middle">Real-Time Chat</text>

    <!-- LISTING GROUP -->
    <text x="700" y="375" font-size="13" font-weight="bold" font-style="italic" fill="#555">Property Listing</text>
    <ellipse cx="700" cy="410" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="700" y="415" text-anchor="middle">Create Listing</text>
    <ellipse cx="700" cy="470" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="700" y="475" text-anchor="middle">Edit Listing</text>
    <ellipse cx="700" cy="530" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="700" y="535" text-anchor="middle">Delete Listing</text>
    <ellipse cx="700" cy="590" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="700" y="595" text-anchor="middle">Upload Photos</text>

    <!-- PAYMENT GROUP -->
    <text x="965" y="320" font-size="13" font-weight="bold" font-style="italic" fill="#555">Payment Methods</text>
    <ellipse cx="965" cy="355" rx="100" ry="26" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
    <text x="965" y="360" text-anchor="middle">Set Payment Methods</text>
    <ellipse cx="965" cy="415" rx="100" ry="26" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
    <text x="965" y="420" text-anchor="middle">View Payment Info</text>
    <ellipse cx="965" cy="475" rx="100" ry="26" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
    <text x="965" y="480" text-anchor="middle">Pay via MTN/Airtel</text>

    <!-- LANDLORD/AGENT GROUP -->
    <text x="430" y="540" font-size="13" font-weight="bold" font-style="italic" fill="#555">Landlord Tools</text>
    <ellipse cx="430" cy="575" rx="100" ry="26" fill="#e6ffed" stroke="#2f855a" stroke-width="1.5"/>
    <text x="430" y="580" text-anchor="middle">Manage Inquiries</text>
    <ellipse cx="430" cy="635" rx="100" ry="26" fill="#e6ffed" stroke="#2f855a" stroke-width="1.5"/>
    <text x="430" y="640" text-anchor="middle">Set Availability</text>

    <!-- FAVORITES / AGENT GROUP -->
    <text x="700" y="638" font-size="13" font-weight="bold" font-style="italic" fill="#555">Account &amp; Agent</text>
    <ellipse cx="700" cy="673" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="700" y="678" text-anchor="middle">Save Favorites</text>
    <ellipse cx="700" cy="733" rx="92" ry="26" fill="#eaf3fb" stroke="#1f3864" stroke-width="1.5"/>
    <text x="700" y="738" text-anchor="middle">Apply as Agent</text>

    <!-- ADMIN GROUP -->
    <text x="965" y="538" font-size="13" font-weight="bold" font-style="italic" fill="#c53030">Administration</text>
    <ellipse cx="965" cy="575" rx="100" ry="26" fill="#ffe5e5" stroke="#c53030" stroke-width="1.5"/>
    <text x="965" y="580" text-anchor="middle">Approve/Reject Listing</text>
    <ellipse cx="965" cy="635" rx="100" ry="26" fill="#ffe5e5" stroke="#c53030" stroke-width="1.5"/>
    <text x="965" y="640" text-anchor="middle">Flag Fraud Payment</text>
    <ellipse cx="965" cy="695" rx="100" ry="26" fill="#ffe5e5" stroke="#c53030" stroke-width="1.5"/>
    <text x="965" y="700" text-anchor="middle">Manage Users</text>
    <ellipse cx="965" cy="755" rx="100" ry="26" fill="#ffe5e5" stroke="#c53030" stroke-width="1.5"/>
    <text x="965" y="760" text-anchor="middle">Verify Agents</text>
    <ellipse cx="965" cy="815" rx="100" ry="26" fill="#ffe5e5" stroke="#c53030" stroke-width="1.5"/>
    <text x="965" y="820" text-anchor="middle">View Analytics</text>
  </g>

  <!-- ===== ACTOR–USE CASE CONNECTIONS ===== -->
