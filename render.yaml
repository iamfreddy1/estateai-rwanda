# ============================================
# RENDER BLUEPRINT
# ============================================
# When you connect this repo to Render and use "Blueprint" deploy,
# it provisions BOTH services described below in one click.

databases:
  - name: estateai-db
    plan: free
    databaseName: estateai
    user: estateai

services:
  - type: web
    name: estateai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # eventlet worker is REQUIRED for Flask-SocketIO (chat) - must match Procfile
    # Run migrations idempotently before booting the web worker.
    # migrate.py is safe to run repeatedly - it only adds missing columns.
    startCommand: python migrate.py && gunicorn --worker-class eventlet -w 1 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estateai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.10
      # ---- set these in the Render dashboard (sync:false keeps secrets out of git) ----
      - key: ALLOWED_ORIGINS      # comma-separated web origins for CORS; mobile app is unaffected
        sync: false
      - key: GOOGLE_CLIENT_IDS    # web + android OAuth client IDs, comma-separated
        sync: false
      - key: SEED_SECRET          # protects /admin/seed (recreate-db is prod-disabled)
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    healthCheckPath: /health
